# ============================================================================
# CI Pipeline — Validación Progresiva por Nivel de Rama
# ============================================================================
#
# La rigurosidad escala conforme el código se acerca a producción:
#
#   feat → feat       : Prettier, ESLint, ls-lint, TypeScript
#   feat → phase      : + Dependency Cruiser (arquitectura)
#   phase → develop   : + Build, Tests (futuro)
#   develop → production : + Knip (código muerto)
#
# ============================================================================

name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - production
      - develop
      - 'phase/**'
      - 'feat/**'
      - 'fix/**'
      - 'refactor/**'
      - 'chore/**'

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate PR
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      # ── Branch Flow Validation ─────────────────────────────────────────

      - name: Validate Branch Flow Strategy
        run: |
          BASE_REF="${{ github.base_ref }}"
          HEAD_REF="${{ github.head_ref }}"

          echo "Target Branch (Base): $BASE_REF"
          echo "Source Branch (Head): $HEAD_REF"

          # Rule 1: production can ONLY receive from develop
          if [[ "$BASE_REF" == "production" ]]; then
            if [[ "$HEAD_REF" != "develop" ]]; then
              echo "❌ Error: The Flow Strategy forbids merging '$HEAD_REF' directly into 'production'. Only 'develop' can be merged into production."
              exit 1
            fi
          fi

          # Rule 2: develop receives from phase/* OR emergency tasks (feat/fix/chore/refactor)
          if [[ "$BASE_REF" == "develop" ]]; then
            if [[ ! "$HEAD_REF" =~ ^(phase/|feat/|fix/|refactor/|chore/) ]]; then
              echo "❌ Error: 'develop' can only receive PRs from 'phase/' branches or direct task branches (feat/, fix/, etc.). '$HEAD_REF' is not allowed."
              exit 1
            fi
          fi

      # ── Setup ──────────────────────────────────────────────────────────

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # ── PR Title (Semantic) ────────────────────────────────────────────

      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            chore
          scopes: |
            core-saas
            iam
            classtrack
            admindesk
            shared
            api
            database
            infra
            deps
            tools
            docs
            root
            ci
          requireScope: false
          subjectPattern: ^(?=.{1,120}$)[a-zA-Z].+$

      # ── Nivel 1: Base (TODAS las ramas) ────────────────────────────────
      # Prettier · ESLint · ls-lint · TypeScript

      - name: Code Formatting (Prettier)
        run: pnpm exec prettier --check "**/*.{ts,js,json,md,yaml,yml}"

      - name: Code Linting (ESLint)
        run: pnpm run lint

      - name: File Naming (ls-lint)
        run: pnpm run lint:files

      - name: Type Checking (TypeScript)
        run: pnpm run typecheck

      # ── Nivel 2: feat → phase (+ Dependency Cruiser) ───────────────────

      - name: Architecture Rules (Dependency Cruiser)
        if: >-
          startsWith(github.base_ref, 'phase/')
          || github.base_ref == 'develop'
          || github.base_ref == 'production'
        run: pnpm run lint:deps

      # ── Nivel 3: phase → develop (+ Build + Tests) ────────────────────

      - name: Build
        if: >-
          github.base_ref == 'develop'
          || github.base_ref == 'production'
        run: pnpm run build

      # - name: Tests
      #   if: >-
      #     github.base_ref == 'develop'
      #     || github.base_ref == 'production'
      #   run: pnpm run test

      # ── Nivel 4: develop → production (+ Knip) ────────────────────────

      - name: Dead Code Analysis (Knip)
        if: github.base_ref == 'production'
        run: pnpm run knip
